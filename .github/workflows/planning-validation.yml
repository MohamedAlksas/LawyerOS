name: Planning package validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'docs/**'
      - 'fix/**'
      - 'codex/**'

permissions:
  contents: read

jobs:
  validate-planning:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate task cards and project skills
        shell: pwsh
        run: ./scripts/Validate-AntigravityKit.ps1
      - name: Rebuild prompt index and planning package
        shell: pwsh
        run: |
          ./scripts/Validate-AgencyAgentRouting.ps1
          ./scripts/Update-AgencyAgentPrompts.ps1
          ./scripts/Build-TaskPromptIndex.ps1
          ./scripts/Build-PlanningKit.ps1
      - name: Check maintained text deliverables are current
        shell: pwsh
        run: |
          git diff --exit-code -- docs/tasks docs/PROMPTS.md outputs/LawOffice-OS-Master-Plan.md outputs/LawOffice-OS-Gemini-Prompts.md outputs/LawOffice-OS-Antigravity-T01.md outputs/LawOffice-OS-Start-Here.md
          if ($LASTEXITCODE -ne 0) { throw 'Regenerate the planning deliverables and commit the updated files.' }
