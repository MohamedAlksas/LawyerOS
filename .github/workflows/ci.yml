name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_USER: lawoffice_user
          POSTGRES_PASSWORD: lawoffice_dev_secret
          POSTGRES_DB: lawoffice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      DATABASE_URL: postgresql://lawoffice_user:lawoffice_dev_secret@localhost:5432/lawoffice_dev?schema=public
      TEST_DATABASE_URL: postgresql://lawoffice_user:lawoffice_dev_secret@localhost:5432/lawoffice_test?schema=public
      BETTER_AUTH_SECRET: synthetic_development_secret_32_bytes_minimum_length_required
      BETTER_AUTH_URL: http://127.0.0.1:3100
      PARTY_IDENTITY_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PARTY_IDENTITY_KEY_ID: k2026_01

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 26 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Clean installation from lockfile
        run: npm ci

      - name: Cache Playwright Chromium browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy Prisma database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://lawoffice_user:lawoffice_dev_secret@localhost:5432/lawoffice_test?schema=public


      - name: Lint check
        run: npm run lint
        env:
          NODE_ENV: test

      - name: TypeScript strict typecheck
        run: npm run typecheck
        env:
          NODE_ENV: test

      - name: Run unit tests
        run: npm run test
        env:
          NODE_ENV: test

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test

      - name: Upload test artifacts on failure
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
