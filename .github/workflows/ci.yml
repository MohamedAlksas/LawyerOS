name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  test-and-build:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_USER: lawoffice_user
          POSTGRES_PASSWORD: lawoffice_dev_secret
          POSTGRES_DB: lawoffice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      CI: 'true'
      DATABASE_URL: postgresql://lawoffice_user:lawoffice_dev_secret@localhost:5432/lawoffice_test?schema=public
      TEST_DATABASE_URL: postgresql://lawoffice_user:lawoffice_dev_secret@localhost:5432/lawoffice_test?schema=public
      BETTER_AUTH_SECRET: synthetic_development_secret_32_bytes_minimum_length_required
      BETTER_AUTH_URL: http://127.0.0.1:3100

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 26 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Clean installation from lockfile
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy Prisma database migrations
        run: npx prisma migrate deploy

      - name: Lint check
        run: npm run lint

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Run integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Run Playwright E2E tests
        run: npm run test:e2e
